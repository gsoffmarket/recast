/* Recast design system: Void theme tokens (see the Recast design system artifact). */
:root {
  color-scheme: dark;
  --bg-canvas: #000000; --bg-surface-1: #0a0a0a; --bg-surface-2: #111111; --bg-surface-3: #1a1a1a;
  --bg-hover: rgba(255,255,255,.05); --bg-selected: rgba(128,82,255,.14);
  --border-subtle: rgba(255,255,255,.08); --border-default: rgba(255,255,255,.12); --border-strong: rgba(255,255,255,.22);
  --text-display: #ffffff; --text-primary: #ededed; --text-secondary: #bdbdbd; --text-tertiary: #9a9a9a;
  --iris: #8052ff; --iris-hover: #9068ff; --iris-text: #a88bff; --on-iris: #ffffff; --focus-ring: #a88bff;
  --saffron: #ffb829; --on-saffron: #000; --verdant: #15846e; --verdant-text: #2ec4a0;
  --ok: #3dd68c; --ok-bg: rgba(48,164,108,.15); --miss: #ff9592; --miss-bg: rgba(229,72,77,.15);
  --chg: #70b8ff; --chg-bg: rgba(0,144,255,.15); --unc: #ffca16; --unc-bg: rgba(255,184,41,.15); --unt: #9a9a9a; --unt-bg: rgba(255,255,255,.07);
  --diff-add: rgba(46,160,67,.15); --diff-del: rgba(248,81,73,.15);
  --font-sans: "Geist", "Inter", ui-sans-serif, system-ui, sans-serif; --font-mono: "Geist Mono", ui-monospace, Menlo, monospace;
  --r-sm: 6px; --r-md: 10px; --r-lg: 16px; --r-pill: 9999px; --fast: 120ms; --base: 180ms; --ease-out: cubic-bezier(.16,1,.3,1);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg-canvas); color: var(--text-primary); font: 400 14px/1.55 var(--font-sans); -webkit-font-smoothing: antialiased; font-feature-settings: "ss01" 1; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
a { color: var(--iris-text); text-decoration: none; } a:hover { text-decoration: underline; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--text-tertiary); } .sec { color: var(--text-secondary); }

.shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100%; }
.side { background: var(--bg-surface-1); border-right: 1px solid var(--border-subtle); padding: 20px 12px; display: flex; flex-direction: column; gap: 24px; position: sticky; top: 0; height: 100vh; }

.nav a { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: var(--r-sm); color: var(--text-secondary); font-weight: 500; font-size: 13px; text-decoration: none; position: relative; }
.nav a:hover { background: var(--bg-hover); color: var(--text-primary); }
.nav a[aria-current="page"] { background: var(--bg-surface-3); color: var(--text-display); }
.nav a[aria-current="page"]::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; background: var(--iris); }
.nav svg { width: 16px; height: 16px; }
.side .foot { margin-top: auto; padding: 0 8px; font-size: 12px; color: var(--text-tertiary); display: grid; gap: 4px; }
main { min-width: 0; }
header.top { height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 32px; border-bottom: 1px solid var(--border-subtle); position: sticky; top: 0; background: rgba(0,0,0,.85); backdrop-filter: blur(8px); z-index: 5; }
.crumb { color: var(--text-tertiary); font-size: 13px; } .crumb b { color: var(--text-primary); font-weight: 500; }
.envs { display: flex; gap: 8px; flex-wrap: wrap; }
.env { display: inline-flex; align-items: center; gap: 8px; height: 26px; padding: 0 12px 0 10px; border-radius: var(--r-pill); border: 1px solid var(--border-default); font: 400 12px/1 var(--font-mono); color: var(--text-secondary); white-space: nowrap; }
.env i { width: 8px; height: 8px; border-radius: 50%; background: var(--text-tertiary); }
.env.target i { background: var(--chg); } .env.candidate i { background: var(--iris); }
.content { padding: 32px; display: grid; gap: 24px; max-width: 1280px; }
h1 { font-size: 28px; line-height: 1.2; font-weight: 400; letter-spacing: -.84px; color: var(--text-display); margin: 0; }
h2 { font-size: 16px; font-weight: 500; letter-spacing: -.16px; margin: 0; color: var(--text-primary); }
.lede { color: var(--text-secondary); margin: 6px 0 0; max-width: 72ch; }
.eyebrow { font: 600 12px/1.2 var(--font-sans); letter-spacing: .48px; text-transform: uppercase; color: var(--saffron); }

.summary { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.big { font-size: 48px; line-height: 1; letter-spacing: -1.92px; color: var(--text-display); font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px; border-radius: var(--r-pill); border: 1px solid var(--border-default); color: var(--text-secondary); font: 500 12px/1 var(--font-sans); background: transparent; cursor: pointer; }

.chip[aria-pressed="true"] { background: var(--bg-surface-3); border-color: var(--border-strong); color: var(--text-primary); }

.panel { background: var(--bg-surface-2); border: 1px solid var(--border-subtle); border-radius: var(--r-md); min-width: 0; }

tr:last-child td { border-bottom: 0; }
tbody tr.sel { cursor: pointer; transition: background var(--fast) ease; }

tbody tr[aria-selected="true"] { background: var(--bg-selected); }
.id { font: 400 12px/1.4 var(--font-mono); color: var(--text-secondary); white-space: nowrap; }

.badge { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px 0 6px; border-radius: var(--r-sm); font: 500 12px/1 var(--font-sans); white-space: nowrap; }
.badge svg { width: 14px; height: 14px; }
.b-preserved, .b-satisfied, .b-passed, .b-verified_candidate, .b-verified { color: var(--ok); background: var(--ok-bg); }
.b-missing, .b-not_satisfied, .b-unresolved, .b-rejected_protected, .b-rejected_paths, .b-gate_failed, .b-reverify_failed { color: var(--miss); background: var(--miss-bg); }
.b-intentional_change { color: var(--chg); background: var(--chg-bg); }
.b-uncertain, .b-unverified, .b-infra_error, .b-did_not_pass, .b-agent_unavailable, .b-no_patch, .b-cancelled, .b-inconclusive { color: var(--unc); background: var(--unc-bg); }
.b-frozen, .b-established { color: var(--iris-text); background: var(--bg-selected); }
.b-untested, .b-candidate, .b-source-observed, .b-queued, .b-running, .b-executing, .b-verifying, .b-patching, .b-retrying, .b-building { color: var(--unt); background: var(--unt-bg); }

.verdict { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--r-md); font-size: 14px; }
.verdict.missing { background: var(--miss-bg); } .verdict.preserved { background: var(--ok-bg); } .verdict.other { background: var(--unc-bg); }
.verdict svg { width: 18px; height: 18px; flex: none; margin-top: 2px; }
.compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.side-card { background: var(--bg-surface-2); border: 1px solid var(--border-subtle); border-radius: var(--r-md); padding: 16px; display: grid; gap: 12px; min-width: 0; align-content: start; }
.side-card .h { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; font-size: 13px; }
dl.kv dt { color: var(--text-tertiary); } dl.kv dd { margin: 0; font: 400 12px/1.5 var(--font-mono); overflow-wrap: anywhere; }
blockquote.kane { margin: 0; padding: 10px 12px; border-radius: var(--r-sm); background: var(--bg-surface-3); color: var(--text-secondary); font-size: 13px; }
blockquote.kane b { color: var(--text-tertiary); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .36px; display: block; margin-bottom: 2px; }

.grid2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 1100px) { .grid2 { grid-template-columns: 1fr; } }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; max-height: 560px; overflow-y: auto; }
.ev { display: grid; grid-template-columns: 20px 1fr auto; gap: 12px; position: relative; padding-bottom: 14px; animation: in var(--base) var(--ease-out); }
@keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.ev::before { content: ""; position: absolute; left: 9px; top: 20px; bottom: 0; width: 1px; background: var(--border-default); }
.ev:last-child::before { display: none; }
.dot { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--bg-surface-3); color: var(--text-tertiary); }
.dot svg { width: 12px; height: 12px; }
.ev.ok .dot { color: var(--ok); background: var(--ok-bg); } .ev.fail .dot { color: var(--miss); background: var(--miss-bg); } .ev.warn .dot { color: var(--unc); background: var(--unc-bg); }
.ev.live .dot { background: var(--saffron); color: var(--on-saffron); animation: pulse 1.6s var(--ease-out) infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,184,41,.45); } 50% { box-shadow: 0 0 0 5px rgba(255,184,41,0); } }
.ev .t { font-size: 13px; } .ev .m { font: 400 12px/1.5 var(--font-mono); color: var(--text-tertiary); overflow-wrap: anywhere; } .ev .tm { font: 400 12px/20px var(--font-mono); color: var(--text-tertiary); }

.diff { border: 1px solid var(--border-subtle); border-radius: var(--r-md); overflow: hidden; background: var(--bg-surface-1); }
.diff .file { padding: 8px 12px; border-bottom: 1px solid var(--border-subtle); font: 400 12px/1.5 var(--font-mono); color: var(--text-secondary); background: var(--bg-surface-2); }
.diff pre { margin: 0; overflow-x: auto; font: 400 12.5px/20px var(--font-mono); }
.diff .l { display: block; padding: 0 12px; white-space: pre; }
.diff .add { background: var(--diff-add); } .diff .del { background: var(--diff-del); } .diff .hunk { color: var(--iris-text); background: var(--bg-surface-2); }
.gate { display: flex; gap: 8px; flex-wrap: wrap; }
pre.report { margin: 0; white-space: pre-wrap; font: 400 13px/1.6 var(--font-mono); color: var(--text-secondary); }
.cmd { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; border-radius: var(--r-sm); background: var(--bg-surface-3); font: 400 12.5px/1.4 var(--font-mono); color: var(--text-primary); }
.cmd code { flex: 1; overflow-x: auto; white-space: nowrap; }
.btn { display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border-radius: var(--r-sm); border: 1px solid var(--border-strong); background: transparent; color: var(--text-primary); font: 500 12px/1 var(--font-sans); cursor: pointer; }
.btn:hover { background: var(--bg-hover); }
.empty { padding: 40px 16px; text-align: center; color: var(--text-tertiary); }
.empty h3 { font-size: 20px; font-weight: 400; letter-spacing: -.4px; color: var(--text-primary); margin: 0 0 6px; }
@media (max-width: 760px) { .shell { grid-template-columns: 1fr; } .side { position: static; height: auto; flex-direction: row; align-items: center; } .side .foot { display: none; } .nav { grid-auto-flow: column; } header.top, .content { padding-left: 16px; padding-right: 16px; } }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition-duration: 0ms !important; } }



/* ---- v2 layout: top bar app shell ---- */
.app { min-height: 100%; display: flex; flex-direction: column; }
.bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 24px; height: 56px; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); background: rgba(0,0,0,.86); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border-subtle); }

.bar nav a:hover { background: var(--bg-hover); color: var(--text-primary); }
.bar nav a[aria-current="page"] { background: var(--bg-surface-3); color: var(--text-display); }
.bar .spacer { flex: 1; }
.bar .snap { font: 400 12px/1.3 var(--font-mono); color: var(--text-tertiary); white-space: nowrap; cursor: help; border-bottom: 1px dotted var(--border-strong); }
.menu { position: relative; }
.menu > button { height: 32px; }
.menu-list { position: absolute; right: 0; top: 38px; min-width: 200px; background: var(--bg-surface-3); border: 1px solid var(--border-default); border-radius: var(--r-md); box-shadow: 0 12px 32px rgba(0,0,0,.72); padding: 6px; display: grid; gap: 2px; z-index: 20; }
.menu-list[hidden], .menu[hidden] { display: none; }
.menu-list a { display: block; padding: 8px 10px; border-radius: var(--r-sm); color: var(--text-primary); font-size: 13px; text-decoration: none; }
.menu-list a:hover { background: var(--bg-hover); }
main.page { width: 100%; max-width: 1200px; margin: 0 auto; padding: 32px max(16px, env(safe-area-inset-right, 0px)) 64px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 28px; }
main.page { grid-template-columns: minmax(0, 1fr); }
.col .id, .req-head .id { white-space: normal; }
.col .h > div { min-width: 0; flex: 1 1 auto; }
div[style*="display:grid"], section[style*="display:grid"], .req-head, .req-list, .cmpwrap, .col, .life li > div { grid-template-columns: minmax(0, 1fr); min-width: 0; }

/* ---- landing ---- */
.hero { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 48px; align-items: center; padding: 40px 0 8px; }
.hero h1 { font-size: clamp(44px, 7vw, 96px); line-height: 1.0; letter-spacing: -0.04em; font-weight: 400; color: var(--text-display); margin: 0; text-wrap: balance; }

/* ---- premium buttons: depth, light and a little motion ---- */

  background: linear-gradient(180deg, #9a78ff 0%, #8052ff 52%, #6c3df2 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.32), inset 0 -1px 0 rgba(0,0,0,.22), 0 0 0 1px rgba(128,82,255,.6), 0 10px 28px -8px rgba(128,82,255,.7), 0 2px 6px rgba(0,0,0,.45);
  transition: transform var(--base) var(--ease-out), box-shadow var(--base) ease, filter var(--base) ease; }
.btn-primary::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.32) 50%, transparent 70%); transform: translateX(-130%); transition: transform 750ms var(--ease-out); }

  box-shadow: inset 0 1px 0 rgba(255,255,255,.36), inset 0 -1px 0 rgba(0,0,0,.22), 0 0 0 1px rgba(150,112,255,.8), 0 16px 36px -10px rgba(128,82,255,.85), 0 2px 6px rgba(0,0,0,.45); }
.btn-primary:hover::before { transform: translateX(130%); }

function trendChart(hist, reqIds) {
  if (!hist.length) return h('p', { class: 'muted' }, 'No comparisons yet.');
  const latest = {}; const points = [];
  for (const e of hist) { latest[e.requirement_id] = e.status; const vals = Object.values(latest); points.push({ t: new Date(e.created_at).getTime(), v: vals.filter((x) => x === 'preserved' || x === 'intentional_change').length, m: vals.filter((x) => x === 'missing').length }); }
  const W = 560, H = 140, P = 24, t0 = points[0].t, t1 = Math.max(points.at(-1).t, t0 + 1), max = Math.max(1, reqIds.length);
  const x = (t) => P + (W - 2 * P) * (t - t0) / (t1 - t0), y = (v) => H - P - (H - 2 * P) * v / max;
  const path = (k) => points.map((p, i) => `${i ? 'L' : 'M'}${x(p.t).toFixed(1)},${y(p[k]).toFixed(1)}${i < points.length - 1 ? `H${x(points[i + 1].t).toFixed(1)}` : ''}`).join('');
  const el = h('div', { class: 'trend' });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Verified and missing requirements over time"><line x1="${P}" x2="${W - P}" y1="${H - P}" y2="${H - P}" stroke="rgba(255,255,255,.12)"/><path d="${path('m')}" fill="none" stroke="#ff9592" stroke-width="2"/><path d="${path('v')}" fill="none" stroke="#3dd68c" stroke-width="2"/><circle cx="${x(points.at(-1).t)}" cy="${y(points.at(-1).v)}" r="3.5" fill="#3dd68c"/><circle cx="${x(points.at(-1).t)}" cy="${y(points.at(-1).m)}" r="3.5" fill="#ff9592"/><text x="${P}" y="14" fill="#9a9a9a" font-size="11" font-family="Geist Mono, monospace">verified (green) · missing (red) · ${max} in scope</text></svg>`;
  return el;
}

// ---------- router ----------
async function route() {
  const hash = location.hash.replace(/^#\/?/, '');
  const [view, ...rest] = hash.split('/');
  loading();
  try {
    if (!view) await (SNAP ? landing() : home());
    else if (view === 'parity') await home();
    else if (view === 'requirements' && rest[0]) await requirement(decodeURIComponent(rest[0]));
    else if (view === 'discovery') await discovery();
    else notFound();
    const h1 = $('#page h1'); if (h1 && !firstRoute) { h1.setAttribute('tabindex', '-1'); h1.focus({ preventScroll: true }); }
    firstRoute = false;
    motion();
    scrollTo(0, 0);
  } catch (e) { errorView(e); }
}

  const set = (open) => { panel.hidden = !open; btn.setAttribute('aria-expanded', String(open)); btn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu'); document.body.classList.toggle('menu-open', open); };
  btn.addEventListener('click', (e) => { e.stopPropagation(); set(panel.hidden); });
  panel.addEventListener('click', (e) => { if (e.target.closest('a')) set(false); });
  addEventListener('click', (e) => { if (!panel.hidden && !e.target.closest('.bar')) set(false); });
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && !panel.hidden) { set(false); btn.focus(); } });
  addEventListener('hashchange', () => set(false));
  matchMedia('(min-width: 721px)').addEventListener('change', (m) => { if (m.matches) set(false); });
})();

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)');
let revealer = null;
function countUp(el) {
  const target = Number(el.textContent);
  if (!Number.isInteger(target) || target <= 0) return;
  const t0 = performance.now(), dur = 700;
  const tick = (t) => { const k = Math.min(1, (t - t0) / dur); el.textContent = String(Math.round(target * (1 - Math.pow(1 - k, 3)))); if (k < 1) requestAnimationFrame(tick); };
  el.textContent = '0'; requestAnimationFrame(tick);
}
/** Entrance for each new page, scroll reveal below the fold, count-up for headline numbers. */
function motion() {
  revealer?.disconnect();
  if (REDUCED.matches) return;
  [...page().children].forEach((el, i) => { el.style.setProperty('--n', i); el.classList.add('enter'); });
  const vh = innerHeight;
  revealer = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      const el = e.target; revealer.unobserve(el);
      el.classList.add('in');
      el.querySelectorAll('b, .v').forEach(countUp);
      // drop the reveal classes once done so hover transitions are not delayed
      setTimeout(() => { el.classList.remove('rv', 'in'); el.style.removeProperty('--d'); }, 900);
    }
  }, { rootMargin: '0px 0px -8% 0px' });
  const groups = new Map();
  page().querySelectorAll('.result, .req-card, .steps5 > div, .numbers > div, .stat, .life li, .netdiff > *, .cmp .step, .guard, .fix-diff, .term, .closer, .att, .legend-grid > div, .funnel .f, .findings > div, .grid2 > .panel').forEach((el) => {
    const top = el.getBoundingClientRect().top;
    const key = el.parentElement; const i = groups.get(key) ?? 0; groups.set(key, i + 1);
    if (top < vh) return;
    el.style.setProperty('--d', `${Math.min(i, 5) * 60}ms`);
    el.classList.add('rv'); revealer.observe(el);
  });
  page().querySelectorAll('.numbers > div > b, .stat .v').forEach((b) => { const card = b.parentElement.closest('.numbers > div, .stat'); if (card && !card.classList.contains('rv') && card.getBoundingClientRect().top < vh) countUp(b); });
}
let firstRoute = true;

route();
