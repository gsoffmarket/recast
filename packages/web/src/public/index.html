.btn { display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border-radius: var(--r-sm); border: 1px solid var(--border-strong); background: transparent; color: var(--text-primary); font: 500 12px/1 var(--font-sans); cursor: pointer; }

// ---------- shell ----------

// ---------- parity ----------

        ...Object.entries(last.observed || {}).flatMap(([k, v]) => [h('dt', {}, k), h('dd', {}, JSON.stringify(v))]),
        h('dt', {}, 'runs'), h('dd', {}, runs.map((r) => `${short(r.id)} ${LABEL[r.verdict] || r.verdict || r.state}`).join(' · ')),
        h('dt', {}, 'query'), h('dd', {}, last.fixture_ref || '—'),
        ...(last.candidate_sha ? [h('dt', {}, 'candidate'), h('dd', {}, short(last.candidate_sha, 12))] : []),
        h('dt', {}, 'credits'), h('dd', {}, runs.map((r) => r.credits != null ? r.credits.toFixed(2) : '?').join(' + ')),
        h('dt', {}, 'evidence'), h('dd', {}, runs.map((r) => r.evidence_sha256 ? 'sha256:' + short(r.evidence_sha256, 12) : 'unavailable').join(' · ')),
      ) : h('p', { class: 'muted' }, 'No qualifying run.'),
      last?.kane_said ? h('blockquote', { class: 'kane' }, h('b', {}, `Kane said (${last.kane_outcome}${last.kane_category ? ', ' + last.kane_category.replace(/_/g, ' ') : ''})`), last.kane_said) : null,
      last?.failed_step ? h('blockquote', { class: 'kane' }, h('b', {}, 'Failing step'), last.failed_step) : null,
      runs.length ? h('button', { class: 'btn', type: 'button', onclick: () => openRun(last.id, title) }, 'Open run timeline') : null,
    );
  };
  const vclass = latest?.status === 'missing' ? 'missing' : latest?.status === 'preserved' ? 'preserved' : 'other';
  $('#detail').replaceChildren(h('div', { class: 'grid2' },
    h('div', { style: 'display:grid;gap:12px;min-width:0' },
      latest ? h('div', { class: `verdict ${vclass}` }, svg(GLYPH[glyphFor(latest.status)]), h('div', {}, h('strong', { style: 'font-weight:500' }, `${LABEL[latest.status]}. `), latest.explanation, h('div', { class: 'muted mono', style: 'margin-top:6px;font-size:12px' }, `${latest.reason_code} · ${time(latest.created_at)}`))) : null,
      h('div', { class: 'compare' }, side('Source', 'source', src, src[0]?.environment), side('Target', tgt[0]?.env_kind || 'target', tgt, tgt[0]?.environment)),
      h('div', { class: 'panel' }, h('div', { class: 'head' }, h('h2', {}, `${d.requirement.id} r${d.requirement.revision}`), badge(d.lifecycle)),
        h('div', { class: 'body' }, h('dl', { class: 'kv' },
          h('dt', {}, 'intent'), h('dd', { style: 'font-family:var(--font-sans);font-size:13px' }, d.requirement.action_intent),
          h('dt', {}, 'assertions'), h('dd', {}, d.requirement.assertions.map((a) => `${a.path} ${a.operator} ${JSON.stringify(a.expected)}`).join(' ∧ ')),
          h('dt', {}, 'oracle'), h('dd', {}, `${d.requirement.oracle}, settle ${d.requirement.settle_ms} ms`),
          h('dt', {}, 'lifecycle'), h('dd', {}, `${d.lifecycle}${d.frozenAt ? ' · frozen ' + new Date(d.frozenAt).toLocaleString() : ''}`),
          h('dt', {}, 'hash'), h('dd', {}, d.hash)),
          h('div', { style: 'margin-top:12px;display:grid;gap:8px' }, latest?.status === 'missing' ? cmd(`pnpm recast repair --requirement ${d.requirement.id}`) : cmd(`pnpm recast compare --requirement ${d.requirement.id} --target trino-preview`)))),
    ),
    h('div', { class: 'panel' }, h('div', { class: 'head' }, h('h2', { id: 'tl-title' }, 'Run timeline'), h('span', { class: 'muted', style: 'font-size:12px' }, 'persisted events')), h('div', { class: 'body' }, h('ol', { class: 'timeline', id: 'timeline' }, h('li', { class: 'muted' }, 'Select a run.')))),
  ));
  const pick = tgt[tgt.length - 1] || src[src.length - 1];
  if (pick) openRun(pick.id, tgt.length ? 'Target' : 'Source');
}

function eventRow(e, live) {
  const p = e.payload || {};
  const map = {
    'run.started': ['Run started', `${p.kind} · ${p.environment} · trino ${p.fingerprint?.version ?? '?'}${p.candidateSha ? ' · candidate ' + short(p.candidateSha, 10) : ''}`, ''],
    'fixture.ready': ['Fresh query running', p.queryId, 'ok'],
    'kane.invoked': ['Kane started', p.startUrl, ''],
    'kane.step': [p.remark || `step ${p.step}`, `step ${p.step} · ${p.status}`, p.status === 'failed' ? 'fail' : ''],
    'kane.run_end': [`Kane finished: ${p.status}`, p.one_liner || p.reason || '', p.status === 'passed' ? 'ok' : 'warn'],
    'oracle.observed': ['Oracle observed', Object.entries(p.values || {}).map(([k, v]) => `${k}=${v}`).join(' '), ''],
    'fixture.cleanup': ['Leftover query cancelled via REST', `HTTP ${p.restStatus}`, ''],
    'evidence.recorded': ['Evidence pack recorded', `sha256:${short(p.sha256, 16)} · ${p.entries} files`, 'ok'],
    'run.evaluated': [`Recast verdict: ${LABEL[p.verdict] || p.verdict}`, (p.assertions || []).map((a) => `${a.path} ${a.outcome}`).join(' · '), p.verdict === 'satisfied' ? 'ok' : p.verdict === 'not_satisfied' ? 'fail' : 'warn'],
    'run.failed': ['Run failed', p.error, 'fail'],
    'task.created': ['Repair task created', `${p.requirement} r${p.revision}`, ''],
    'attempt.started': [`Attempt ${p.attempt} started`, `${p.branch} @ ${short(p.baseSha, 10)}`, ''],
    'agent.finished': [`Agent finished (${p.toolUses} tool calls)`, (p.summary || '').slice(0, 220), p.isError ? 'warn' : ''],
    'agent.unavailable': ['Agent unavailable', p.reason, 'warn'],
    'patch.collected': [`Patch: ${(p.changed || []).length} file(s)`, (p.changed || []).map((c) => c.split('/').pop()).join(', '), (p.disallowed || []).length ? 'fail' : ''],
    'gate.finished': [`Build gate ${p.ok ? 'passed' : 'failed'}`, (p.steps || []).map((s) => `${s.name} ${s.ok ? 'ok' : 'FAIL'}`).join(' · '), p.ok ? 'ok' : 'fail'],
    'candidate.committed': ['Candidate committed', `${short(p.candidateSha, 12)} on ${p.branch}`, 'ok'],
    'reverify.classified': [`Re-verify: ${LABEL[p.status] || p.status}`, p.explanation, p.status === 'preserved' ? 'ok' : 'fail'],
    'task.verified': ['Verified candidate', `${short(p.candidateSha, 12)} on ${p.branch}`, 'ok'],
    'task.unresolved': ['Unresolved', `${p.attempts} attempts used`, 'fail'],
    'task.cancelled': ['Task cancelled', p.reason, 'warn'],
    'attempt.rejected': ['Attempt rejected', p.reason, 'fail'],
  };
  if (e.type === 'kane.unknown' || e.type === 'kane.stream_start' || e.type === 'kane.session') return null;
  const [t, m, cls] = map[e.type] || [e.type, JSON.stringify(p).slice(0, 160), ''];
  const icon = cls === 'ok' ? '<path d="M2.5 6.2l2.2 2.2 4.8-5"/>' : cls === 'fail' ? '<path d="M3.5 3.5l5 5M8.5 3.5l-5 5"/>' : cls === 'warn' ? '<path d="M6 3v4M6 9h.01"/>' : '<circle cx="6" cy="6" r="1.5" fill="currentColor"/>';
  return h('li', { class: `ev ${live ? 'live' : cls}` }, h('span', { class: 'dot' }, svg(icon, '0 0 12 12')), h('div', {}, h('div', { class: 't' }, t), m ? h('div', { class: 'm' }, m) : null), h('span', { class: 'tm' }, time(e.at)));
}

function stream(url, list, onEnd) {
  const es = new EventSource(url);
  streams.push(es);
  const add = (msg) => { const e = JSON.parse(msg.data); const row = eventRow(e, false); if (!row) return; list.querySelectorAll('.ev.live').forEach((x) => x.classList.remove('live')); row.classList.add('live'); list.append(row); list.scrollTop = list.scrollHeight - list.clientHeight < 80 ? list.scrollHeight : list.scrollTop; };
  es.addEventListener('run', add); es.addEventListener('task', add);
  es.addEventListener('end', () => { list.querySelectorAll('.ev.live').forEach((x) => x.classList.remove('live')); es.close(); onEnd && onEnd(); });
}

function openRun(id, label) {
  closeStreams();
  const list = $('#timeline');
  if (!list) return;
  $('#tl-title').textContent = `${label} run ${short(id)}`;
  list.replaceChildren();
  stream(`/api/runs/${id}/events`, list);
}

// ---------- discovery ----------
async function discoveryView() {
  await frame('discovery');

  const head = h('div', {}, h('div', { class: 'eyebrow' }, 'Observe'), h('h1', {}, 'Discovery'), h('p', { class: 'lede' }, 'What Kane Exploration found in the source app. Discovery shows what exists, not what it does: a candidate becomes a requirement only after real baseline runs.'));
  if (!d || !d.runs.length) { view.replaceChildren(head, h('div', { class: 'panel empty' }, h('h3', {}, 'No exploration imported yet'), 'Map the source app with Kane, then import it.', h('div', { style: 'max-width:520px;margin:16px auto 0' }, cmd('pnpm recast discover run --max-leases 8')))); return; }
  const by = (k) => d.items.filter((i) => i.kind === k);

        h('tbody', {}, by('candidate').map((c) => h('tr', {}, h('td', { style: 'min-width:180px' }, c.title), h('td', { class: 'id', style: 'white-space:normal' }, c.detail.screenUrl || '—'), h('td', { class: 'sec', style: 'white-space:normal;min-width:260px;max-width:460px' }, c.detail.why || ''), h('td', {}, candStatus(c)))))))),
    h('div', { class: 'grid2' },
      h('div', { class: 'panel' }, h('div', { class: 'head' }, h('h2', {}, 'Screens')), h('div', { class: 'body', style: 'display:grid;gap:12px' }, by('screen').map((x) => h('div', {}, h('div', {}, x.title), h('div', { class: 'id' }, x.key), h('div', { class: 'muted', style: 'font-size:12px;margin-top:4px' }, `${x.detail.controls.length} controls · ${x.detail.controls.filter((c) => c.scope === 'policy_blocked').map((c) => c.name).join(', ') || 'none'} not pressed by policy`))))),
      h('div', { class: 'panel' }, h('div', { class: 'head' }, h('h2', {}, 'Verified flows')), h('div', { class: 'body', style: 'display:grid;gap:12px' }, by('flow').map((x) => h('div', {}, h('div', {}, x.title.trim() || '(unnamed)'), h('div', { class: 'muted', style: 'font-size:12px' }, (x.detail.steps || []).slice(0, 6).join(' → ') || x.detail.description || '')))))),
  );
}

// ---------- repair ----------
function renderDiff(patch) {
  if (!patch) return h('p', { class: 'muted' }, 'No patch.');
  const files = patch.split(/^diff --git /m).filter(Boolean);
  return h('div', { style: 'display:grid;gap:12px' }, files.map((f) => {
    const name = (f.match(/ b\/(\S+)/) || [])[1] || 'file';
    const body = f.split('\n').filter((l) => !/^(index |--- |\+\+\+ |new file|deleted file|similarity|rename )/.test(l)).slice(1);
    return h('div', { class: 'diff' }, h('div', { class: 'file' }, name.split('/').slice(-3).join('/')),
      h('pre', {}, body.map((l) => h('span', { class: `l ${l.startsWith('+') ? 'add' : l.startsWith('-') ? 'del' : l.startsWith('@@') ? 'hunk' : ''}` }, l || ' '))));
  }));
}

async function repairView(taskId) {
  await frame('repair');
  const tasks = await api('/api/tasks');
  const view = $('#view');
  const head = h('div', {}, h('div', { class: 'eyebrow' }, 'Migration'), h('h1', {}, 'Repair'), h('p', { class: 'lede' }, 'A confirmed gap becomes a task. The coding agent works in an isolated worktree of the target; Recast checks paths, the build and then re-runs the frozen requirement with Kane and the oracle.'));
  const checks = await api('/api/checks');
  const checksPanel = checks.length ? h('div', { class: 'panel' }, h('div', { class: 'head' }, h('h2', {}, 'Candidate checks'), h('span', { class: 'muted', style: 'font-size:12px' }, 'harness patches and controls · not counted as parity')),
    h('div', { class: 'tbl-wrap' }, h('table', {}, h('thead', {}, h('tr', {}, ['Check', 'Requirement', 'Candidate', 'Runs', 'Result', 'Expected'].map((c) => h('th', { scope: 'col' }, c)))),
      h('tbody', {}, checks.map((c) => h('tr', {}, h('td', {}, c.label), h('td', { class: 'id' }, `${c.requirement_id} r${c.revision}`), h('td', { class: 'id' }, `${c.ref} @ ${short(c.candidate_sha, 10)}`), h('td', { class: 'id' }, c.verdicts.join(', ')), h('td', {}, badge(c.status)), h('td', {}, h('span', { class: `badge b-${c.as_expected ? 'passed' : 'gate_failed'}` }, svg(GLYPH[c.as_expected ? 'ok' : 'miss']), c.as_expected ? `${c.expected} ✓` : `expected ${c.expected}`)))))))) : null;
  if (!tasks.length) { view.replaceChildren(head, checksPanel, h('div', { class: 'panel empty' }, h('h3', {}, 'No repair tasks yet'), 'Run a comparison until a requirement is Missing, then start a repair.', h('div', { style: 'max-width:520px;margin:16px auto 0' }, cmd('pnpm recast repair --requirement REQ-QRY-CANCEL')))); return; }
  const sel = taskId || tasks[0].id;
  const t = await api(`/api/tasks/${sel}`);
  closeStreams();
  view.replaceChildren(head, checksPanel,
    h('div', { class: 'panel' }, h('div', { class: 'tbl-wrap' }, h('table', {}, h('thead', {}, h('tr', {}, ['Task', 'Requirement', 'State', 'Attempts', 'Updated'].map((c) => h('th', { scope: 'col' }, c)))),
      h('tbody', {}, tasks.map((x) => h('tr', { class: 'sel', tabindex: '0', 'aria-selected': String(x.id === sel), onclick: () => repairView(x.id) }, h('td', { class: 'id' }, short(x.id)), h('td', { class: 'id' }, `${x.requirement_id} r${x.revision}`), h('td', {}, badge(x.state)), h('td', { class: 'id' }, `${x.attempts} / ${x.max_attempts}`), h('td', { class: 'id' }, time(x.updated_at)))))))),
    h('div', { class: 'grid2' },
      h('div', { style: 'display:grid;gap:12px;min-width:0' }, t.attempts.length ? t.attempts.map((a) => h('div', { class: 'panel' },
        h('div', { class: 'head' }, h('h2', {}, `Attempt ${a.attempt}`), badge(a.state)),
        h('div', { class: 'body', style: 'display:grid;gap:12px' },
          h('dl', { class: 'kv' }, h('dt', {}, 'agent'), h('dd', {}, a.agent || '—'), h('dt', {}, 'branch'), h('dd', {}, a.branch || '—'), h('dt', {}, 'candidate'), h('dd', {}, a.candidate_sha ? short(a.candidate_sha, 12) : '—'),
            h('dt', {}, 'work'), h('dd', {}, `${a.tool_uses ?? 0} tool calls · ${a.denied_tools ?? 0} denied · ${a.agent_ms ? Math.round(a.agent_ms / 1000) + ' s' : '—'}${a.agent_cost_usd != null ? ' · $' + Number(a.agent_cost_usd).toFixed(2) : ''}`)),
          a.gate ? h('div', { class: 'gate' }, a.gate.steps.map((s) => h('span', { class: `badge b-${s.ok ? 'passed' : 'gate_failed'}` }, svg(GLYPH[s.ok ? 'ok' : 'miss']), s.name))) : null,
          a.decision ? h('div', { class: `verdict ${a.decision.status === 'preserved' ? 'preserved' : 'missing'}` }, svg(GLYPH[glyphFor(a.decision.status)]), h('div', {}, h('strong', { style: 'font-weight:500' }, `${LABEL[a.decision.status]}. `), a.decision.explanation)) : null,
          a.agent_summary ? h('blockquote', { class: 'kane' }, h('b', {}, 'Agent said (not used to judge)'), a.agent_summary.slice(0, 600)) : null,
          renderDiff(a.patch),
        ))) : h('div', { class: 'panel empty' }, 'No attempts yet.')),
      h('div', { class: 'panel' }, h('div', { class: 'head' }, h('h2', {}, 'Task timeline'), badge(t.state)), h('div', { class: 'body' }, h('ol', { class: 'timeline', id: 'ttl' }))),
    ));
  stream(`/api/tasks/${sel}/events`, $('#ttl'));
}

// ---------- report ----------
async function reportView() {
  await frame('report');
  const md = await fetch('/api/report.md', { cache: 'no-store' }).then((r) => r.text());
  $('#view').replaceChildren(h('div', {}, h('div', { class: 'eyebrow' }, 'Export'), h('h1', {}, 'Acceptance report'), h('p', { class: 'lede' }, 'Scoped evidence for the requirements listed, with real denominators. Also available as JSON and CSV from the CLI.')),
    h('div', { style: 'display:grid;gap:8px;max-width:720px' }, cmd('pnpm recast report --format markdown --out report.md'), cmd('pnpm recast report --format csv --out report.csv')),
    h('div', { class: 'panel' }, h('div', { class: 'body' }, h('pre', { class: 'report' }, md))));
}

async function route() {
  closeStreams();
  const [view, arg] = (location.hash.replace(/^#/, '') || 'parity').split('-');
  try { if (view === 'repair') await repairView(arg); else if (view === 'report') await reportView(); else if (view === 'discovery') await discoveryView(); else await parityView(); }
  catch (e) { $('#view').replaceChildren(h('div', { class: 'panel empty' }, h('h3', {}, 'Could not load this view'), String(e.message || e), h('p', {}, 'Check that Postgres is running (docker-compose up -d) and the project exists (pnpm recast init).'))); }
}
addEventListener('hashchange', route);
route();
